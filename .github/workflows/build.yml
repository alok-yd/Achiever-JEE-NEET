name: Build ACHIEVER JEE/NEET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile when needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock audited npm dependency tree"
          git push
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities||{})) { const fix=v.fixAvailable===true?"available":v.fixAvailable===false?"none":JSON.stringify(v.fixAvailable); console.log(name+" | "+v.severity+" | direct="+v.isDirect+" | range="+v.range+" | fix="+fix+" | via="+v.via.map(x=>typeof x==="string"?x:x.name+": "+x.title).join("; ")); }'
      - name: Run unit tests
        run: npm test
      - name: Type-check and create production bundle
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v7
        with:
          name: achiever-jee-neet-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
